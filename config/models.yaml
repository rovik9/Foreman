# Foreman model registry.
# Every model is a swappable SLOT. Direct vendor keys only — no middleman:
# first-party serving (quality guarantee) + exact per-provider billing.
# Cost estimation comes from config/prices.yaml, not the gateway.

slots:
  pm:                                  # the only model the user talks to
    provider: anthropic
    model: claude-sonnet-5             # placeholder
    via: anthropic
  architect:
    provider: openai
    model: gpt-5.6-sol                 # placeholder
    via: openai
    fallback: claude-opus-5            # placeholder
  builder_a:
    provider: moonshot
    model: kimi-k3                     # placeholder
    via: moonshot
  builder_b:
    provider: anthropic
    model: claude-sonnet-5             # placeholder
    via: anthropic
  realtime:                            # news / data / trends feed
    provider: groq
    model: groq-fast-latest            # placeholder
    via: groq
  judge:                               # verifier LLM (rubric scoring)
    provider: anthropic
    model: claude-sonnet-5             # placeholder
    via: anthropic

# Router: task class -> ordered candidate slots (cheapest-first preference
# is applied inside each class using the cost table below).
tiers:
  plan:     [architect]
  build:    [builder_a, builder_b]
  critique: [judge]
  fetch:    [realtime]

# Relative cost weights (1.0 = baseline). Router picks the cheapest slot in
# a class that meets the task's quality floor. Absolute $ estimates come
# from config/prices.yaml.
cost_weights:
  architect: 3.0
  builder_a: 1.0
  builder_b: 1.5
  judge:     1.5
  realtime:  0.2
  pm:        1.5

asset_studios:
  video:
    type: mcp
    command: higgsfield-mcp            # Higgsfield via MCP; HIGGSFIELD_API_KEY in .env
    args: []
  audio:
    type: mcp
    command: audio-mcp                 # placeholder
    args: []

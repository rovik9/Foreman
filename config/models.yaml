# Foreman model registry — LIVE (all-Moonshot while Kimi is the only key).
# Slot INTENT preserved in comments; swap back to multi-vendor as keys arrive:
#   pm/judge/builder_b -> anthropic (Sonnet/Opus), architect -> openai (GPT),
#   realtime -> groq, video -> higgsfield MCP.

slots:
  pm:                                  # the only model the user talks to
    provider: moonshot
    model: kimi-k3                     # intent: claude-sonnet-5
    via: moonshot
  architect:
    provider: moonshot
    model: kimi-k3                     # intent: gpt-5.6-sol / claude-opus-5
    via: moonshot
  builder_a:
    provider: moonshot
    model: kimi-k2.7-code              # code-specialized — the right builder
    via: moonshot
  builder_b:
    provider: moonshot
    model: kimi-k2.7-code-highspeed    # fast code variant
    via: moonshot
  realtime:                            # intent: groq (fastest news feed)
    provider: moonshot
    model: kimi-k2.7-code-highspeed
    via: moonshot
  judge:                               # different model than builders on purpose:
    provider: moonshot                 # avoids self-agreement bias
    model: kimi-k2.6                   # intent: claude-sonnet-5
    via: moonshot
  memorizer:                           # memory distiller — cheapest/fast
    provider: moonshot
    model: kimi-k2.7-code-highspeed
    via: moonshot
  context:                             # long-context synthesis
    provider: moonshot                 # intent: google (gemini-3-pro)
    model: kimi-k3
    via: moonshot

# Roles are JOBS; slots above are MODEL bindings. The user preselects the
# option list per role — the Interface AI picks per task within options
# (fast, no open-ended deliberation) and logs its reasoning.
# Intent once keys arrive:
#   interface: [claude-sonnet-5] · architect: [gpt-5.6-sol, claude-opus-5, gemini-3-pro]
#   trend: [groq-fast-latest] · context: [gemini-3-pro] · builder: [kimi-k3, claude-sonnet-5]
roles:
  interface: { options: [pm], active: pm }
  architect: { options: [architect], active: architect }
  trend:     { options: [realtime], active: realtime }
  context:   { options: [context], active: context }
  builder:   { options: [builder_a, builder_b], active: builder_a }
  judge:     { options: [judge], active: judge }
  memorizer: { options: [memorizer], active: memorizer }

tiers:
  plan:     [architect]
  build:    [builder_a, builder_b]
  critique: [judge]
  fetch:    [realtime]

cost_weights:
  architect: 2.0
  builder_a: 1.0
  builder_b: 0.8
  judge:     1.2
  realtime:  0.5
  pm:        1.5
  memorizer: 0.8

asset_studios:
  video:
    type: mcp
    command: higgsfield-mcp            # placeholder until Higgsfield MCP confirmed
    args: []
  audio:
    type: mcp
    command: audio-mcp                 # placeholder
    args: []

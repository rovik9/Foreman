<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foreman — Mission Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-run="">
  <!-- LAYOUT CONTRACT (stable ids — js binds to them; Claude Code skins):
       topbar: brand · project tabs (chrome-style) · mode · yolo · costs
       left: sessions of active project
       centre: stage tabs (feed / assets / permissions) + bottom input
       right: tasks · roster (who's on what) · changes · promptings -->
  <header id="topbar">
    <div id="brand">FOREMAN</div>
    <nav id="project-tabs" role="tablist"></nav>
    <button id="new-project-btn" title="New project">+</button>
    <div id="controls">
      <select id="mode-select" title="Run mode">
        <option value="full">full</option>
        <option value="plan">plan</option>
        <option value="design">design</option>
      </select>
      <label id="yolo-label" title="Bypass all permission gates for the next run">
        <input type="checkbox" id="yolo-toggle"> yolo
      </label>
    </div>
    <div id="costs">
      <span id="cost-session" title="Active run cost">$0.0000</span>
      <span id="cost-project" title="Active project total">proj $0.00</span>
    </div>
  </header>

  <main id="layout">
    <aside id="sessions-panel">
      <h3 class="panel-title">Sessions</h3>
      <div id="sessions-list"></div>
    </aside>

    <section id="stage">
      <div id="stage-header">
        <span id="stage-run-label">No active session</span>
        <span id="stage-run-status" class="pill"></span>
      </div>
      <div id="stage-tabs">
        <button class="stage-tab active" data-tab="feed">Feed</button>
        <button class="stage-tab" data-tab="assets">Assets</button>
        <button class="stage-tab" data-tab="permissions">Permissions <span id="perm-count" class="hidden"></span></button>
      </div>
      <div id="stage-feed" class="stage-page"></div>
      <div id="stage-assets" class="stage-page hidden"></div>
      <div id="stage-permissions" class="stage-page hidden"></div>
    </section>

    <aside id="rightbar">
      <section id="tasks-panel">
        <h3 class="panel-title">Tasks</h3>
        <div id="tasks-list"></div>
      </section>
      <section id="roster-panel">
        <h3 class="panel-title">Who's working</h3>
        <div id="roster-list"></div>
      </section>
      <section id="changes-panel">
        <h3 class="panel-title">Code changes</h3>
        <div id="changes-list"></div>
      </section>
      <section id="promptings-panel">
        <h3 class="panel-title">Interface &amp; crew</h3>
        <div id="promptings-list"></div>
      </section>
    </aside>
  </main>

  <footer id="input-bar">
    <button id="stop-btn" class="hidden" title="Stop the active run">■</button>
    <button id="accept-btn" class="hidden" title="Accept & push project memory">✓</button>
    <input id="main-input" placeholder="Dispatch a goal, or steer the active run…">
    <button id="steer-btn" class="hidden">Steer</button>
    <button id="dispatch-btn">Dispatch</button>
  </footer>

  <!-- new project popup -->
  <div id="project-modal" class="hidden">
    <form id="project-form">
      <h3>New project</h3>
      <input id="pf-name" placeholder="Project name" required>

      <label for="pf-memory-dir">Memory local folder (blank = default)</label>
      <div class="pf-path-row">
        <input id="pf-memory-dir" placeholder="blank = default">
        <button type="button" class="pf-browse" data-target="pf-memory-dir">Browse&hellip;</button>
      </div>

      <label for="pf-memory-repo">Memory git repo URL (blank = auto/none)</label>
      <input id="pf-memory-repo" placeholder="git@github.com:you/project-memory.git">

      <label class="pf-checkbox"><input type="checkbox" id="pf-monorepo" checked> Monorepo — one repo for everything</label>

      <div id="pf-folders">
        <label>Project local folders: <input type="number" id="pf-folder-count" min="0" value="1"></label>
        <div id="pf-folder-inputs"></div>
      </div>

      <div id="pf-repos">
        <label id="pf-repo-count-row" class="hidden">How many repos? <input type="number" id="pf-repo-count" min="1" value="1"></label>
        <div id="pf-repo-inputs"></div>
      </div>

      <div class="modal-actions">
        <button type="button" id="pf-cancel">Cancel</button>
        <button type="submit">Create</button>
      </div>
    </form>
  </div>

  <!-- local folder picker (server-driven — browsers can't hand a page a real OS path) -->
  <div id="fs-picker" class="hidden">
    <div class="fs-picker-card">
      <div id="fs-picker-path"></div>
      <div id="fs-picker-list"></div>
      <div class="modal-actions">
        <button type="button" id="fs-picker-cancel">Cancel</button>
        <button type="button" id="fs-picker-choose">Choose this folder</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>

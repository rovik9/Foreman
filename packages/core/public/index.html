<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foreman — Mission Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-run="">
  <!-- SKELETON: structure is final, styling is Claude Code's canvas.
       Panels are plain <section> regions with stable IDs — restyle freely,
       do not rename IDs (js/components bind to them). -->
  <header id="topbar">
    <button id="sidebar-toggle" title="Toggle sidebar">☰</button>
    <div id="brand">FOREMAN</div>
    <div id="run-context">
      <span id="run-label">no run</span>
      <span id="run-status-pill" class="pill"></span>
    </div>
    <div id="cost-meter" title="Total run cost">$0.0000</div>
    <button id="accept-run-btn" class="hidden">Accept &amp; Push</button>
  </header>

  <div id="dispatch-bar">
    <input id="prompt-input" placeholder="Tell the foreman what to build…" autofocus>
    <button id="dispatch-btn">Dispatch</button>
  </div>

  <main id="layout">
    <aside id="sidebar">
      <section id="projects-panel">
        <div class="panel-head">
          <h3 class="panel-title">Projects</h3>
          <button id="new-project-btn" title="New project">+</button>
        </div>
        <div id="projects-list"></div>
      </section>
      <section id="runs-panel">
        <h3 class="panel-title">Runs</h3>
        <div id="runs-list"></div>
      </section>
    </aside>

    <section id="stage">
      <h3 class="panel-title">Activity</h3>
      <div id="activity-feed"></div>
    </section>

    <aside id="dock">
      <section id="tasks-panel">
        <h3 class="panel-title">Tasks</h3>
        <div id="tasks-list"></div>
      </section>
      <section id="assets-panel">
        <h3 class="panel-title">Assets</h3>
        <div id="assets-list"></div>
      </section>
      <section id="chat-panel">
        <h3 class="panel-title">Chat</h3>
        <div id="chat-log"></div>
        <div id="chat-bar">
          <input id="chat-input" placeholder="Steer mid-run / answer the interface…">
          <button id="chat-send-btn">Send</button>
        </div>
      </section>
      <section id="memory-panel">
        <h3 class="panel-title">Memory</h3>
        <div id="memory-list"></div>
      </section>
    </aside>
  </main>

  <!-- New-project modal: structure final, styling is Claude Code's. -->
  <dialog id="project-modal">
    <form id="project-form" method="dialog">
      <h3 class="panel-title">New project</h3>
      <label>Project name
        <input id="pf-name" required placeholder="Rovik Capital">
      </label>
      <label>Memory — local folder (blank = default vault)
        <input id="pf-memory-dir" placeholder="~/foreman-memory/rovik-capital">
      </label>
      <label>Memory — git repo URL (blank = auto-create via GITHUB_TOKEN)
        <input id="pf-memory-repo" placeholder="git@github.com:rovik/rovik-capital-memory.git">
      </label>
      <fieldset id="pf-workspaces">
        <legend>Project local folders (workspaces)</legend>
        <div id="pf-workspace-list"></div>
        <button type="button" id="pf-add-workspace">+ add folder</button>
      </fieldset>
      <fieldset id="pf-repos">
        <legend>Code git repos (one for monorepo, many otherwise)</legend>
        <div id="pf-repo-list"></div>
        <button type="button" id="pf-add-repo">+ add repo</button>
      </fieldset>
      <div class="modal-actions">
        <button type="button" id="pf-cancel">Cancel</button>
        <button type="submit" id="pf-create">Create project</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>

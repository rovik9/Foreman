<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foreman — Mission Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-run="">
  <!-- SKELETON: structure is final, styling is Claude Code's canvas.
       Panels are plain <section> regions with stable IDs — restyle freely,
       do not rename IDs (js/components bind to them). -->
  <header id="topbar">
    <div id="brand">FOREMAN</div>
    <select id="project-switcher" title="Active project"></select>
    <button id="new-project-btn">+ Project</button>
    <div id="run-context">
      <span id="run-label">no run</span>
      <span id="run-status-pill" class="pill"></span>
    </div>
    <div id="cost-meter" title="Total run cost">$0.0000</div>
    <button id="accept-run-btn" class="hidden">Accept &amp; Push</button>
  </header>

  <div id="dispatch-bar">
    <input id="prompt-input" placeholder="Tell the foreman what to build…" autofocus>
    <button id="dispatch-btn">Dispatch</button>
  </div>

  <main id="layout">
    <aside id="runs-panel">
      <h3 class="panel-title">Runs</h3>
      <div id="runs-list"></div>
    </aside>

    <section id="stage">
      <h3 class="panel-title">Activity</h3>
      <div id="activity-feed"></div>
    </section>

    <aside id="dock">
      <section id="tasks-panel">
        <h3 class="panel-title">Tasks</h3>
        <div id="tasks-list"></div>
      </section>
      <section id="assets-panel">
        <h3 class="panel-title">Assets</h3>
        <div id="assets-list"></div>
      </section>
      <section id="chat-panel">
        <h3 class="panel-title">Chat</h3>
        <div id="chat-log"></div>
        <div id="chat-bar">
          <input id="chat-input" placeholder="Steer mid-run / answer the interface…">
          <button id="chat-send-btn">Send</button>
        </div>
      </section>
      <section id="memory-panel">
        <h3 class="panel-title">Memory</h3>
        <div id="memory-list"></div>
      </section>
    </aside>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
